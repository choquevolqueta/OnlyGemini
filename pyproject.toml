[project]
name = "onlygemini"
version = "1.0.0"
description = "ComfyUI custom nodes wrapping Google Gemini APIs for image generation, multi-image composition, video generation (Veo and Gemini Omni Flash), and local LaMa inpainting."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alexander Cortez" }]
keywords = ["comfyui", "gemini", "veo", "omni-flash", "video", "image", "inpainting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv",
    "av",
    "simple-lama-inpainting>=0.1.2",
    "opencv-python>=4.8.0",
]

[project.urls]
Repository = "https://github.com/choquevolqueta/OnlyGemini"

[tool.comfy]
PublisherId = "choquevolqueta"
DisplayName = "OnlyGemini"
# Icon = "https://raw.githubusercontent.com/choquevolqueta/OnlyGemini/main/icon.png"  # optional: square PNG/JPG/SVG, max 400x400
